<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Gán run ?</title><style>
body{margin:0;font:14px system-ui,sans-serif;display:flex;height:100vh;color:#222}
#nav{width:150px;overflow:auto;border-right:1px solid #ddd;background:#fafafa}
#nav div{padding:3px 10px;cursor:pointer;font-size:13px}#nav div.cur{background:#dbe8ff}#nav div.done{color:#1a7f37}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:8px 14px;border-bottom:1px solid #ddd}#head .m{color:#666;font-size:13px;margin-top:2px}
#log{flex:1;overflow:auto;font:12.5px/1.45 Consolas,Menlo,monospace;background:#fff}
.l{display:flex;cursor:pointer;white-space:pre-wrap;word-break:break-all}.l:hover{background:#f3f3f3}
.n{width:48px;flex:none;text-align:right;padding-right:8px;color:#999;user-select:none}.t{flex:1;padding-right:10px}
.l.hdr{background:#eef2f7;font-weight:bold;cursor:default;margin-top:6px}.l.sel{background:#fff1b8}
.l.sel .n{color:#b35c00;font-weight:bold}
#side{width:300px;border-left:1px solid #ddd;padding:10px 12px;overflow:auto}
button.lf{display:block;width:100%;text-align:left;margin:2px 0;padding:4px 6px;border:1px solid #ccc;background:#fff;
border-radius:4px;cursor:pointer;font-size:13px}button.lf.on{background:#2f6fde;color:#fff;border-color:#2f6fde}
button.lf small{color:#888;display:block;font-size:11px}button.lf.on small{color:#dde}
#sel{font:12px Consolas,monospace;margin:6px 0;color:#b35c00}textarea{width:100%;height:50px;box-sizing:border-box}
#save{width:100%;padding:8px;margin-top:6px;background:#1a7f37;color:#fff;border:0;border-radius:4px;font-size:15px;cursor:pointer}
.mut{color:#666;font-size:12px}</style></head><body>
<div id="nav"></div><div id="main"><div id="head"></div><div id="log"></div></div>
<div id="side"><div class="mut">Bấm dòng log để đánh dấu dòng lỗi (bấm lại để bỏ; dòng bấm trước = quan trọng nhất).
Chọn MỘT loại lỗi = nguyên nhân gốc (lỗi xảy ra sớm nhất). Không đủ thông tin: unclear.<br>
Enter = lưu và sang run chưa gán tiếp theo; ← → = chuyển run.</div>
<div id="sel"></div><div id="leaves"></div><textarea id="note" placeholder="ghi chú"></textarea>
<button id="save">Lưu &amp; tiếp (Enter)</button><div id="msg" class="mut"></div></div>
<script>
const CH = __CHOICES__, HELP = __HELP__;
let items = [], lab = {}, cur = 0, leaf = null, sel = [];
const $ = id => document.getElementById(id);
const esc = t => t.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));

async function init() {
  const r = await (await fetch('/api')).json();
  items = r.items; lab = r.labels;
  const first = items.findIndex(x => !lab[x.stt]);
  show(first < 0 ? 0 : first);
}
function nav() {
  $('nav').innerHTML = items.map((x, i) => `<div class="${i == cur ? 'cur' : ''} ${lab[x.stt] ? 'done' : ''}"
    onclick="show(${i})">${x.stt}. ${lab[x.stt] ? '✓ ' + lab[x.stt].leaf : ''}</div>`).join('');
  document.querySelector('#nav .cur')?.scrollIntoView({block: 'nearest'});
}
function show(i) {
  cur = i;
  const x = items[i], l = lab[x.stt] || {};
  leaf = l.leaf || null; sel = (l.lines || []).slice(); $('note').value = l.note || '';
  $('head').innerHTML = `<b>${x.stt}/${items.length} · ${esc(x.repo)}</b> · <a target="_blank"
    href="https://github.com/${x.repo}/actions/runs/${x.run_id}">mở run trên GitHub</a>
    <div class="m">workflow: ${esc(x.workflow || '')} · job fail: ${esc(x.jobs || '')} · step fail: ${esc(x.failed_steps || '')}</div>`;
  $('log').innerHTML = x.lines.map((t, k) => t.startsWith('===== job:')
    ? `<div class="l hdr"><span class="n"></span><span class="t">${esc(t)}</span></div>`
    : `<div class="l" data-k="${k + 1}" onclick="tog(${k + 1})"><span class="n">${k + 1}</span><span class="t">${esc(t) || ' '}</span></div>`
  ).join('');
  $('log').scrollTop = 0; $('msg').textContent = '';
  paint(); nav();
}
function tog(k) { const j = sel.indexOf(k); j < 0 ? sel.push(k) : sel.splice(j, 1); paint(); }
function pick(c) { leaf = c; paint(); }
function paint() {
  document.querySelectorAll('.l[data-k]').forEach(e => {
    const j = sel.indexOf(+e.dataset.k);
    e.classList.toggle('sel', j >= 0);
    e.querySelector('.n').textContent = (j >= 0 ? `[${j + 1}] ` : '') + e.dataset.k;
  });
  $('sel').textContent = sel.length ? 'dòng lỗi: ' + sel.join(', ') : 'chưa chọn dòng lỗi';
  $('leaves').innerHTML = CH.map(c => `<button class="lf ${c == leaf ? 'on' : ''}" onclick="pick('${c}')">${c}
    <small>${esc(HELP[c])}</small></button>`).join('');
}
async function save() {
  if (!leaf) { $('msg').textContent = 'chưa chọn loại lỗi'; return; }
  const x = items[cur], rec = {stt: x.stt, run_id: x.run_id, leaf, lines: sel, note: $('note').value};
  const r = await fetch('/api', {method: 'POST', body: JSON.stringify(rec)});
  if (!r.ok) { alert('lỗi khi lưu'); return; }
  lab[x.stt] = rec;
  const left = items.filter(y => !lab[y.stt]).length;
  const nxt = items.findIndex((y, i) => i > cur && !lab[y.stt]);
  if (nxt >= 0) show(nxt); else { nav(); $('msg').textContent = `đã lưu; còn ${left} run chưa gán`; }
}
$('save').onclick = save;
document.addEventListener('keydown', e => {
  if (e.target.tagName == 'TEXTAREA') return;
  if (e.key == 'Enter') { e.preventDefault(); save(); }
  if (e.key == 'ArrowRight' && cur < items.length - 1) show(cur + 1);
  if (e.key == 'ArrowLeft' && cur > 0) show(cur - 1);
});
init();
</script></body></html>
